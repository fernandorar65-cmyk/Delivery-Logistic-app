<div class="stats-grid">
  @for (stat of stats; track stat.label) {
    <p-card>
      <div class="flex justify-content-between align-items-start mb-2">
        <span class="text-color-secondary font-medium">{{ stat.label }}</span>
        @if (stat.icon) {
          <i [class]="'pi ' + (getPrimeIcon(stat.icon) || 'pi-chart-line')" class="text-primary"></i>
        }
      </div>
      <p class="text-2xl font-bold m-0">{{ stat.value }}</p>
      @if (stat.subtitle) {
        <p class="text-sm text-color-secondary m-0 mt-1">
          @if (stat.trend === 'up') {
            <i class="pi pi-arrow-up text-green-500 mr-1"></i>
          }
          @if (stat.trend === 'down') {
            <i class="pi pi-arrow-down text-red-500 mr-1"></i>
          }
          {{ stat.trendValue ?? stat.subtitle }}
        </p>
      }
    </p-card>
  }
</div>
