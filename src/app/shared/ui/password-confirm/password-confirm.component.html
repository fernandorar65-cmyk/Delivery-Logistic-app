<div class="password-confirm-wrapper">
  <div class="form-group">
    <label [for]="passwordId" class="field-label">
      <span class="label-icon" aria-hidden="true">
        <app-hero-icon name="lock-closed" [size]="16"></app-hero-icon>
      </span>
      {{ passwordLabel }}
      @if (required) {
        <span class="required">*</span>
      } @else {
        <span class="optional">{{ optionalLabel }}</span>
      }
    </label>
    <div class="input-wrapper" [class.invalid]="isPasswordInvalid()">
      <input
        [id]="passwordId"
        [type]="showPassword() ? 'text' : 'password'"
        [value]="passwordValue()"
        [placeholder]="placeholder"
        [disabled]="disabled()"
        (input)="onPasswordInput($event)"
        (blur)="onBlur()"
      />
      <button
        type="button"
        class="visibility-toggle"
        (click)="togglePasswordVisibility()"
        [disabled]="disabled()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        tabindex="-1"
      >
        @if (showPassword()) {
          <app-hero-icon name="eye-slash" [size]="20"></app-hero-icon>
        } @else {
          <app-hero-icon name="eye" [size]="20"></app-hero-icon>
        }
      </button>
    </div>
    @if (required && !isPasswordInvalid()) {
      <span class="hint-text">Mínimo {{ minLength }} caracteres</span>
    }
    @if (!required && !isPasswordInvalid()) {
      <span class="hint-text">{{ optionalLabel }}</span>
    }
    @if (isPasswordInvalid() && getError()) {
      <span class="error-text">{{ getError() }}</span>
    }
  </div>

  <div class="form-group">
    <label [for]="confirmId" class="field-label">
      <span class="label-icon" aria-hidden="true">
        <app-hero-icon name="shield-check" [size]="16"></app-hero-icon>
      </span>
      {{ confirmLabel }}
      @if (required) {
        <span class="required">*</span>
      } @else {
        <span class="optional">{{ optionalLabel }}</span>
      }
    </label>
    <div class="input-wrapper" [class.invalid]="isConfirmInvalid()">
      <input
        [id]="confirmId"
        [type]="showConfirm() ? 'text' : 'password'"
        [value]="confirmPasswordValue()"
        [placeholder]="confirmPlaceholder"
        [disabled]="disabled()"
        (input)="onConfirmInput($event)"
        (blur)="onBlur()"
      />
      <button
        type="button"
        class="visibility-toggle"
        (click)="toggleConfirmVisibility()"
        [disabled]="disabled()"
        [attr.aria-label]="showConfirm() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        tabindex="-1"
      >
        @if (showConfirm()) {
          <app-hero-icon name="eye-slash" [size]="20"></app-hero-icon>
        } @else {
          <app-hero-icon name="eye" [size]="20"></app-hero-icon>
        }
      </button>
    </div>
    @if (isConfirmInvalid() && getError()) {
      <span class="error-text">{{ getError() }}</span>
    }
  </div>
</div>
