<p-dialog
  [header]="title"
  [(visible)]="visible"
  [modal]="true"
  [closable]="showClose"
  [dismissableMask]="true"
  [style]="{ width: widthBySize[size] }"
  [contentStyle]="{ overflow: 'auto', maxHeight: '80vh' }"
  [breakpoints]="{ '960px': '90vw' }"
  (onHide)="onHide()"
  styleClass="app-modal-dialog"
>
  <ng-content></ng-content>
</p-dialog>
