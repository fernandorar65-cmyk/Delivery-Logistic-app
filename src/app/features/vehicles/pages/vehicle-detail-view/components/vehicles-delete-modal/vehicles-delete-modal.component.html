<p-dialog
  header="Confirmar baja de vehículo"
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: '28rem' }"
  [contentStyle]="{ overflow: 'visible' }"
  [breakpoints]="{ '960px': '90vw' }"
  (onHide)="onHide()"
  styleClass="vehicle-delete-dialog"
>
  <div class="vehicle-delete-content">
    <div class="vehicle-delete-icon-wrap">
      <i class="pi pi-exclamation-triangle"></i>
    </div>
    <p class="vehicle-delete-text">
      ¿Estás seguro de que deseas dar de baja este vehículo? Esta acción es irreversible.
    </p>
    @if (deleteError) {
      <div class="vehicle-delete-error" role="alert">
        <i class="pi pi-times-circle"></i>
        <span>{{ deleteError }}</span>
      </div>
    }
  </div>
  <ng-template pTemplate="footer">
    <p-button
      label="Mantener vehículo"
      severity="secondary"
      [outlined]="true"
      (onClick)="onHide()"
      [disabled]="deleteLoading"
    />
    <p-button
      [label]="deleteLoading ? 'Procesando...' : 'Confirmar baja'"
      severity="danger"
      icon="pi pi-times-circle"
      (onClick)="confirm.emit()"
      [loading]="deleteLoading"
      [disabled]="deleteLoading"
    />
  </ng-template>
</p-dialog>
