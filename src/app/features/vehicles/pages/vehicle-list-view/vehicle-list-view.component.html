<div class="page-container">
  <!-- Breadcrumbs -->
  <div class="breadcrumb">
    <a routerLink="/dashboard" class="breadcrumb-link">
      <i class="pi pi-th-large"></i>
      <span>Inicio</span>
    </a>
    <span class="breadcrumb-separator">/</span>
    <a routerLink="/providers" class="breadcrumb-link">Providers</a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current">{{ pageTitle }}</span>
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title-section">
      <h1 class="page-title">{{ pageTitle }}</h1>
      <p class="page-subtitle">{{ pageSubtitle }}</p>
    </div>
    <p-button
      label="Registrar Vehículo"
      icon="pi pi-plus"
      (onClick)="openCreateModal()"
      [disabled]="!effectiveProviderId"
      styleClass="btn-register-vehicle"
    />
  </div>

  <!-- Stats Summary -->
  <app-vehicles-stats [stats]="stats()"></app-vehicles-stats>

  <!-- Filters & Search -->
  <app-vehicles-filters
    [searchQuery]="searchQuery()"
    [vehicleTypeFilter]="vehicleTypeFilter()"
    (searchQueryChange)="searchQuery.set($event); first.set(0)"
    (vehicleTypeChange)="vehicleTypeFilter.set($event); first.set(0)"
  ></app-vehicles-filters>

  <!-- Fleet Table Section -->
  <app-vehicles-table
    [loading]="loading()"
    [error]="error()"
    [vehicles]="paginatedVehicles"
    [totalFiltered]="filteredVehicles.length"
    [providerId]="effectiveProviderId"
    [providerName]="providerName()"
  ></app-vehicles-table>

  <p-paginator
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="filteredVehicles.length"
    [rowsPerPageOptions]="[5, 10, 20, 30]"
    (onPageChange)="onPageChange($event)"
    styleClass="vehicles-paginator"
    [showFirstLastIcon]="true"
  />
</div>

@if (createOpen()) {
  <app-vehicles-create-modal
    [createForm]="createForm"
    [vehicleTypes]="vehicleTypes"
    [statusOptions]="statusOptions"
    [providerLabel]="providerLabel"
    [createLoading]="createLoading()"
    [createError]="createError()"
    (close)="closeCreateModal()"
    (submit)="submitCreateVehicle()"
  ></app-vehicles-create-modal>
}
