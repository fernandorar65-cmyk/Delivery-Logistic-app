<div class="stats-grid">
  @for (stat of stats; track stat.label) {
    <p-card styleClass="stat-card-p">
      <div class="stat-header">
        <div class="stat-icon-wrap" [class]="'stat-icon-' + stat.iconColor">
          <i [class]="getStatIcon(stat.icon)"></i>
        </div>
        @if (stat.trendValue) {
          <p-tag
            [value]="stat.trendValue"
            [severity]="getTrendSeverity(stat.trend)"
            styleClass="stat-trend-tag"
          />
        }
      </div>
      <p class="stat-label">{{ stat.label }}</p>
      <p class="stat-value">{{ stat.value }}</p>
    </p-card>
  }
</div>
