<div class="filters-card">
  <div class="filters-container">
    <p-iconField iconPosition="left" styleClass="search-field w-full">
      <p-inputIcon styleClass="pi pi-search" />
      <input
        type="text"
        pInputText
        [ngModel]="searchQuery"
        (ngModelChange)="searchQueryChange.emit($event)"
        placeholder="Buscar por placa, modelo..."
        class="w-full"
      />
    </p-iconField>
    <p-select
      [options]="typeOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="vehicleTypeFilter"
      (ngModelChange)="vehicleTypeChange.emit($event)"
      placeholder="Tipo de Vehículo"
      styleClass="filter-type-select"
    />
  </div>
</div>
