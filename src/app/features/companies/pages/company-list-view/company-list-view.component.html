<div class="page-container">
  <div class="page-header">
    <div class="page-title-section">
      <h1 class="page-title">Administración de Compañías Clientes</h1>
      <p class="page-subtitle">Gestione sus clientes finales y sus entidades operativas.</p>
    </div>
    <p-button
      label="Agregar Nueva Compañía"
      icon="pi pi-plus"
      (onClick)="openNewCompanyModal()"
      styleClass="btn-add-company"
    />
  </div>

  @if (loading()) {
    <div class="card loading-card">
      <app-loading-card message="Cargando empresas..."></app-loading-card>
    </div>
  } @else if (error()) {
    <div class="card error-card">
      <app-empty-state
        icon="exclamation-triangle"
        title="No se pudieron cargar las empresas"
        [description]="error()"
      ></app-empty-state>
    </div>
  } @else {
    <app-companies-toolbar
      [searchQuery]="searchQuery()"
      [activeFilters]="activeFilters()"
      [sectors]="sectors()"
      [cities]="cities()"
      [selectedSector]="selectedSector()"
      [selectedCity]="selectedCity()"
      (searchChange)="searchQuery.set($event); applyFilters()"
      (removeFilter)="removeFilter($event)"
      (clearFilters)="clearAllFilters()"
      (sectorChange)="selectedSector.set($event); applyFilters()"
      (cityChange)="selectedCity.set($event); applyFilters()"
    ></app-companies-toolbar>

    @if (!filteredCompanies() || filteredCompanies().length === 0) {
      <div class="card empty-state-card">
        <app-empty-state
          icon="users"
          title="No se encontraron empresas"
          description="Intenta ajustar los filtros de búsqueda"
        ></app-empty-state>
      </div>
    } @else {
      <app-companies-table
        [companies]="paginatedCompanies"
        [getCompanyInitials]="getCompanyInitials.bind(this)"
        [getSectorClass]="getSectorClass.bind(this)"
        [getStatusClass]="getStatusClass.bind(this)"
        [getStatusLabel]="getStatusLabel.bind(this)"
        (edit)="openEditCompanyModal($event)"
        (remove)="openDeleteConfirm($event)"
        (uploadOrder)="goToUploadOrder($event)"
      ></app-companies-table>

      <p-paginator
        [first]="first()"
        [rows]="rows()"
        [totalRecords]="filteredCompanies().length"
        [rowsPerPageOptions]="[5, 10, 20, 30]"
        (onPageChange)="onPageChange($event)"
        styleClass="companies-paginator"
        [showFirstLastIcon]="true"
      />
    }
  }

  @if (deleteConfirmOpen()) {
    <app-confirm-modal
      title="Eliminar empresa"
      message="¿Está seguro de que desea eliminar esta empresa?"
      confirmLabel="Eliminar"
      cancelLabel="Cancelar"
      [loading]="deleteLoading()"
      [error]="deleteError()"
      (close)="closeDeleteConfirm()"
      (confirm)="confirmDeleteCompany()"
    ></app-confirm-modal>
  }

  <!-- Modal Flotante -->
  @if (showModal()) {
    <app-companies-form-modal
      [companyForm]="companyForm"
      [isEditMode]="isEditMode()"
      [formLoading]="formLoading()"
      [formError]="formError()"
      (close)="closeModal()"
      (submit)="onSubmit($event)"
    ></app-companies-form-modal>
  }
</div>
