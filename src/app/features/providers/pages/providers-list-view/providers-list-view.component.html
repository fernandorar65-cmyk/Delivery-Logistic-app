<main class="providers-page">
  <header class="providers-header header-card">
    <div>
      <p class="providers-eyebrow">Gestión</p>
      <h1 class="providers-title">Directorio de Aliados</h1>
      <p class="providers-subtitle">Gestión centralizada de socios logísticos, flota y conductores.</p>
    </div>
    <p-button
      label="Nuevo Aliado"
      icon="pi pi-plus"
      (onClick)="openCreateModal()"
      styleClass="btn-new-ally"
    />
  </header>

  <app-providers-stats-cards [stats]="uniqueStats"></app-providers-stats-cards>

  <div class="providers-card">
    <app-providers-toolbar
      [searchQuery]="searchQuery()"
      (searchQueryChange)="searchQuery.set($event)"
    ></app-providers-toolbar>

    <app-providers-table
      [loading]="loading()"
      [error]="error()"
      [allies]="paginatedAllies"
      [showEmail]="isCompanyUser()"
      (createRequested)="openCreateModal()"
    ></app-providers-table>

    @if (filteredAllies.length > 0 && (loading() || paginatedAllies.length > 0)) {
      <p-paginator
        [first]="paginatorFirst"
        [rows]="itemsPerPage()"
        [totalRecords]="filteredAllies.length"
        [rowsPerPageOptions]="[5, 10, 20, 30]"
        (onPageChange)="onPageChange($event)"
        styleClass="providers-paginator"
        [showFirstLastIcon]="true"
      />
    }
  </div>

  <app-provider-create-modal
    [open]="createOpen()"
    (closed)="closeCreateModal()"
    (saved)="handleProviderSaved($event)"
  ></app-provider-create-modal>
</main>
