<div class="filter-bar">
  <p-iconField iconPosition="left" styleClass="search-field">
    <p-inputIcon styleClass="pi pi-search" />
    <input type="text" pInputText placeholder="Buscar cliente por nombre, RUC o email..." class="search-input" />
  </p-iconField>
  <div class="filter-actions">
    @if (showPendingToggle) {
      <p-button
        [label]="pendingActive ? 'Ver todos' : (pendingCount > 0 ? 'Pendientes (' + pendingCount + ')' : 'Pendientes')"
        icon="pi pi-clock"
        [outlined]="!pendingActive"
        [severity]="pendingActive ? 'info' : 'secondary'"
        (onClick)="pendingToggle.emit()"
        styleClass="filter-chip-btn"
      />
    }
    <p-button label="Todos los estados" icon="pi pi-chevron-down" iconPos="right" [outlined]="true" severity="secondary" styleClass="filter-chip-btn" />
    <p-button label="Ciudad" icon="pi pi-map-marker" iconPos="right" [outlined]="true" severity="secondary" styleClass="filter-chip-btn" />
    <p-button label="Limpiar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="clearFilters()" styleClass="filter-reset-btn" />
  </div>
</div>
