<app-modal
  title="Cliente creado correctamente"
  size="sm"
  [showClose]="false"
  (close)="close.emit()"
>
  <div class="success-body">
    <div class="success-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>
    <p class="success-message">El registro fue guardado con éxito.</p>
    <p-button
      label="Entendido"
      severity="primary"
      (onClick)="close.emit()"
      styleClass="success-btn"
    />
  </div>
</app-modal>
