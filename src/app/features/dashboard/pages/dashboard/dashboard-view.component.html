<div class="dashboard-container">
  <!-- Fila 1: 3 tarjetas KPI (estilo Marketing Dashboard) -->
  <app-dashboard-metrics
    [cards]="kpiCards()"
    [periodOptions]="periodOptions"
  ></app-dashboard-metrics>

  <!-- Fila 2: Historial de órdenes (estilo Order History) -->
  <div class="dashboard-bottom">
    <div class="shipments-section">
      <div class="order-history-header">
        <div>
          <h2 class="order-history-title">Historial de órdenes</h2>
          <p class="order-history-subtitle">Este panel muestra el historial de envíos y órdenes recientes.</p>
        </div>
        <div class="order-history-toolbar">
          <p-iconField iconPosition="left" styleClass="search-field">
            <p-inputIcon styleClass="pi pi-search" />
            <input type="text" pInputText placeholder="Buscar..." class="w-full" style="min-width: 14rem" />
          </p-iconField>
          <p-button icon="pi pi-filter" label="Filtros" severity="secondary" [outlined]="true" />
          <p-button icon="pi pi-download" label="Exportar" />
        </div>
      </div>
      <app-dashboard-shipments-tabs
        [activeTab]="activeTab()"
        [incidentsCount]="getIncidentsCount()"
        (tabChange)="setActiveTab($event)"
      ></app-dashboard-shipments-tabs>
      <app-dashboard-shipments-table
        [shipments]="getFilteredShipments()"
        [loading]="loading()"
      ></app-dashboard-shipments-table>
      <div class="pagination-row">
        <span class="pagination-info">Mostrando página {{ tablePage() }} de {{ getTotalPages() }} páginas</span>
        <div class="pagination-controls">
          <p-button icon="pi pi-angle-double-left" [rounded]="true" [text]="true" [disabled]="tablePage() <= 1" (onClick)="goToFirstPage()" />
          <p-button icon="pi pi-angle-left" [rounded]="true" [text]="true" [disabled]="tablePage() <= 1" (onClick)="goToPreviousPage()" />
          <span class="pagination-page">{{ tablePage() }}</span>
          <p-button icon="pi pi-angle-right" [rounded]="true" [text]="true" [disabled]="tablePage() >= getTotalPages()" (onClick)="goToNextPage()" />
          <p-button icon="pi pi-angle-double-right" [rounded]="true" [text]="true" [disabled]="tablePage() >= getTotalPages()" (onClick)="goToLastPage()" />
        </div>
      </div>
    </div>
    <p-card header="Destacados" styleClass="shadow-2 top-products">
      <ul class="top-products-list">
        @for (item of topProducts(); track item.name) {
          <li class="flex align-items-center gap-2 py-2 border-bottom-1 surface-border">
            <p-avatar [label]="item.initials" shape="circle" styleClass="bg-primary" [style]="{ width: '2.5rem', height: '2.5rem' }" />
            <div class="flex-1">
              <div class="font-medium">{{ item.name }}</div>
              <div class="text-sm text-color-secondary">{{ item.detail }}</div>
            </div>
            <span class="font-semibold text-primary">{{ item.value }}</span>
          </li>
        }
      </ul>
    </p-card>
  </div>
</div>
