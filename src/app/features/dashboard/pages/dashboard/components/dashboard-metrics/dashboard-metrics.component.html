<div class="kpi-cards">
  @for (card of cards; track card.title) {
    <p-card styleClass="kpi-card shadow-2">
      <div class="kpi-card-header">
        <span class="kpi-title">{{ card.title }}</span>
        <p-select
          [options]="periodOptions"
          optionLabel="label"
          [(ngModel)]="card.periodOption"
          [style]="{ width: '10rem' }"
          styleClass="kpi-period-select"
        />
      </div>
      <div class="kpi-value-row">
        <span class="kpi-value">{{ card.value }}</span>
        <p-tag
          [severity]="card.changePositive ? 'success' : 'danger'"
          [value]="(card.changePositive ? '+' : '') + card.changePercent + '%'"
          styleClass="kpi-change-pill"
        />
      </div>
      <div class="kpi-chart-wrap">
        <p-chart
          type="line"
          [data]="getChartData(card)"
          [options]="getChartOptions(card)"
        />
      </div>
    </p-card>
  }
</div>
