<p-tabs [value]="activeTab" (valueChange)="onValueChange($event)">
  <p-tablist>
    <p-tab value="all">Todos</p-tab>
    <p-tab value="in-route">En Ruta</p-tab>
    <p-tab value="pending">Pendientes</p-tab>
    <p-tab value="delivered">Entregados</p-tab>
    <p-tab value="incident">
      Incidentes
      @if (incidentsCount > 0) {
        <p-tag [value]="incidentsCount + ''" severity="danger" class="ml-1" />
      }
    </p-tab>
  </p-tablist>
</p-tabs>
